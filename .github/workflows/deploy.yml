name: Deploy to GitHub Pages

on:
  # Deploy on every push to main (a merged, reviewed change).
  push:
    branches: [main]
  # Allow a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Least-privilege token: read the repo, write ONLY to Pages. This is the workflow's
# own GITHUB_TOKEN — it does NOT grant any human/collaborator push access.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # withastro/action installs deps, builds, and uploads the Pages artifact.
      # Astro requires Node >=22.12; the action defaults to 20, so pin it here.
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
